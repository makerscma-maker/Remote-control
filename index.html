<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>שלט micro:bit לרכב</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            user-select: none;
            -webkit-user-select: none;
        }
        h1 { margin-bottom: 10px; }
        .status {
            font-size: 1.2rem;
            margin-bottom: 10px;
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
            background-color: #cf6679;
            color: #000;
            font-weight: bold;
        }
        .status.connected {
            background-color: #03dac6;
        }
        .log-box {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 20px;
            height: 20px;
        }
        .btn-connect {
            background-color: #bb86fc;
            color: #000;
            border: none;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            grid-template-rows: repeat(3, 80px);
            gap: 15px;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            direction: ltr;
        }
        .btn-ctrl {
            background-color: #2c2c2c;
            color: #ffffff;
            border: 2px solid #444;
            border-radius: 12px;
            font-size: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            touch-action: manipulation;
            width: 80px;
            height: 80px;
        }
        .btn-ctrl:active {
            background-color: #bb86fc;
            color: #000;
        }
        .btn-stop {
            background-color: #cf6679;
            color: #000;
            font-size: 1.1rem;
            font-weight: bold;
        }
        .empty { visibility: hidden; }
    </style>
</head>
<body>

    <h1>שלט micro:bit לרכב</h1>
    <div id="status" class="status">מנותק</div>
    <div id="log" class="log-box">לחץ להתחברות</div>
    <button id="connectBtn" class="btn-connect" onclick="connectBT()">התחבר ל-micro:bit</button>

    <div class="grid">
        <div class="empty"></div>
        <button class="btn-ctrl" onmousedown="sendCmd('F')" onmouseup="sendCmd('S')" ontouchstart="sendCmd('F')" ontouchend="sendCmd('S')">▲</button>
        <div class="empty"></div>

        <button class="btn-ctrl" onmousedown="sendCmd('L')" onmouseup="sendCmd('S')" ontouchstart="sendCmd('L')" ontouchend="sendCmd('S')">◄</button>
        <button class="btn-ctrl btn-stop" onclick="sendCmd('S')">עצור</button>
        <button class="btn-ctrl" onmousedown="sendCmd('R')" onmouseup="sendCmd('S')" ontouchstart="sendCmd('R')" ontouchend="sendCmd('S')">►</button>

        <div class="empty"></div>
        <button class="btn-ctrl" onmousedown="sendCmd('B')" onmouseup="sendCmd('S')" ontouchstart="sendCmd('B')" ontouchend="sendCmd('S')">▼</button>
        <div class="empty"></div>
    </div>

    <script>
        const UART_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        // שינוי קריטי: 6e400003 מאפשר כתיבה מקבלת ב-micro:bit
        const UART_RX_CHARACTERISTIC_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

        let rxCharacteristic = null;

        function log(msg) {
            document.getElementById("log").innerText = msg;
        }

        async function connectBT() {
            try {
                log("מחפש מכשיר...");
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'BBC micro:bit' }],
                    optionalServices: [UART_SERVICE_UUID]
                });

                log("מתחבר ל-GATT...");
                const server = await device.gatt.connect();
                
                log("מאתר שירות UART...");
                const service = await server.getPrimaryService(UART_SERVICE_UUID);
                
                log("מאתר ערוץ כתיבה...");
                rxCharacteristic = await service.getCharacteristic(UART_RX_CHARACTERISTIC_UUID);

                const statusEl = document.getElementById("status");
                statusEl.innerText = "מחובר!";
                statusEl.classList.add("connected");
                log("מוכן לשליחת פקודות");
            } catch (error) {
                console.error("שגיאת חיבור:", error);
                log("שגיאה: " + error.message);
            }
        }

        async function sendCmd(cmd) {
            if (!rxCharacteristic) {
                log("לא מחובר!");
                return;
            }
            try {
                const encoder = new TextEncoder();
                await rxCharacteristic.writeValue(encoder.encode(cmd + "\n"));
                log("נשלח: " + cmd);
            } catch (error) {
                log("שגיאת שליחה: " + error.message);
            }
        }
    </script>
</body>
</html>
