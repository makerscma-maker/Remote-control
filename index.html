<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>שלט micro:bit לרכב</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            user-select: none;
            -webkit-user-select: none;
        }
        h1 { margin-bottom: 10px; }
        .status {
            font-size: 1.2rem;
            margin-bottom: 20px;
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
            background-color: #cf6679;
            color: #000;
            font-weight: bold;
        }
        .status.connected {
            background-color: #03dac6;
        }
        .btn-connect {
            background-color: #bb86fc;
            color: #000;
            border: none;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 30px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            grid-template-rows: repeat(3, 80px);
            gap: 15px;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            direction: ltr; /* שומר על סדר המקשים שמאל-מרכז-ימין ללא היפוך עברית */
        }
        .btn-ctrl {
            background-color: #2c2c2c;
            color: #ffffff;
            border: 2px solid #444;
            border-radius: 12px;
            font-size: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            touch-action: manipulation;
            width: 80px;
            height: 80px;
        }
        .btn-ctrl:active {
            background-color: #bb86fc;
            color: #000;
        }
        .btn-stop {
            background-color: #cf6679;
            color: #000;
            font-size: 1.1rem;
            font-weight: bold;
        }
        .empty { visibility: hidden; }
    </style>
</head>
<body>

    <h1>שלט micro:bit לרכב</h1>
    <div id="status" class="status">מנותק</div>
    <br>
    <button id="connectBtn" class="btn-connect" onclick="connectBT()">התחבר ל-micro:bit</button>

    <div class="grid">
        <div class="empty"></div>
        <button class="btn-ctrl" onmousedown="sendCmd('F')" onmouseup="sendCmd('S')" ontouchstart="sendCmd('F')" ontouchend="sendCmd('S')">▲</button>
        <div class="empty"></div>

        <button class="btn-ctrl" onmousedown="sendCmd('L')" onmouseup="sendCmd('S')" ontouchstart="sendCmd('L')" ontouchend="sendCmd('S')">◄</button>
        <button class="btn-ctrl btn-stop" onclick="sendCmd('S')">עצור</button>
        <button class="btn-ctrl" onmousedown="sendCmd('R')" onmouseup="sendCmd('S')" ontouchstart="sendCmd('R')" ontouchend="sendCmd('S')">►</button>

        <div class="empty"></div>
        <button class="btn-ctrl" onmousedown="sendCmd('B')" onmouseup="sendCmd('S')" ontouchstart="sendCmd('B')" ontouchend="sendCmd('S')">▼</button>
        <div class="empty"></div>
    </div>

    <script>
        const UART_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const UART_TX_CHARACTERISTIC_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

        let txCharacteristic = null;

        async function connectBT() {
            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'BBC micro:bit' }],
                    optionalServices: [UART_SERVICE_UUID]
                });

                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(UART_SERVICE_UUID);
                txCharacteristic = await service.getCharacteristic(UART_TX_CHARACTERISTIC_UUID);

                const statusEl = document.getElementById("status");
                statusEl.innerText = "מחובר!";
                statusEl.classList.add("connected");
            } catch (error) {
                console.error("שגיאת חיבור:", error);
                alert("החיבור נכשל: " + error);
            }
        }

        async function sendCmd(cmd) {
            if (!txCharacteristic) return;
            try {
                const encoder = new TextEncoder();
                await txCharacteristic.writeValue(encoder.encode(cmd + "\n"));
            } catch (error) {
                console.error("שגיאה בשליחה:", error);
            }
        }
    </script>
</body>
</html>
